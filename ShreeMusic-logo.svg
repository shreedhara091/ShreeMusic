<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">ShreeMusic Logo</title>
  <desc id="desc">A unique green music logo with the ShreeMusic wordmark.</desc>

  <!-- Icon -->
  <circle cx="90" cy="90" r="72" fill="#13562b"/>

  <!-- Unique music-wave symbol -->
  <path d="M52 68 C68 54, 94 54, 118 68"
        fill="none" stroke="#07110B" stroke-width="10" stroke-linecap="round"/>
  <path d="M48 90 C67 75, 98 75, 122 90"
        fill="none" stroke="#07110B" stroke-width="10" stroke-linecap="round"/>
  <path d="M52 112 C70 98, 96 98, 116 110"
        fill="none" stroke="#07110B" stroke-width="10" stroke-linecap="round"/>

  <!-- Music note integrated into the mark -->
  <path d="M108 50 V106"
        fill="none" stroke="#07110B" stroke-width="9" stroke-linecap="round"/>
  <circle cx="99" cy="116" r="11" fill="#07110B"/>

  <!-- Wordmark -->
  <text x="185" y="108"
        font-family="Arial, Helvetica, sans-serif"
        font-size="64"
        font-weight="700"
        letter-spacing="-2"
        fill="white">ShreeMusic</text>
</svg>